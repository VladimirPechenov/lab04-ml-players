[project]
name = "lab04-ml-players"
version = "1.0.0"
description = "Учебный проект по дисциплине «Игровой ИИ»"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]
artifacts = ["reportlab>=4", "pillow>=10", "imageio-ffmpeg>=0.5", "pymupdf>=1.24"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
